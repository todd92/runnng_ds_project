name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Run automated analysis
        run: uv run python Data/automated_analysis.py

      - name: Validate generated artifacts
        run: |
          test -f Data/reports/analysis_summary.md
          test -f Data/reports/descriptive_stats.csv
          test -f Data/reports/distance_distribution.png
          test -f Data/reports/distance_vs_duration.png
          test -f Data/reports/monthly_distance.png
